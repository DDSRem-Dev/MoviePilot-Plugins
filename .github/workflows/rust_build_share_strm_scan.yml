name: Rust Build share_strm_scan

on:
  workflow_dispatch:
    inputs:
      source_directory:
        description: '插件版本源码目录（both 同时构建 V2 和 V3）'
        required: true
        type: choice
        options:
          - plugins.v2
          - plugins.v3
          - both
        default: 'plugins.v2'

jobs:
  extension_tests:
    name: share_strm_scan unittest in ${{ matrix.source_directory }} on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        source_directory: ${{ fromJSON(inputs.source_directory == 'both' && '["plugins.v2","plugins.v3"]' || format('["{0}"]', inputs.source_directory)) }}
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12', '3.14']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and install share_strm_scan
        working-directory: ${{ matrix.source_directory }}/p115strmhelper/rust_utils/share_strm_scan/
        run: pip install .

      - name: Run tests
        working-directory: ${{ matrix.source_directory }}/p115strmhelper/rust_utils/share_strm_scan/
        run: python -m unittest discover -s tests -v

  build_wheels:
    name: Build wheels for ${{ matrix.source_directory }} / Python ${{ matrix.build.python-version }} / ${{ matrix.build.target }} on ${{ matrix.build.os }}
    needs: [extension_tests]
    runs-on: ${{ matrix.build.os }}
    strategy:
      fail-fast: false
      matrix:
        source_directory: ${{ fromJSON(inputs.source_directory == 'both' && '["plugins.v2","plugins.v3"]' || format('["{0}"]', inputs.source_directory)) }}
        build:
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.14'
          - os: windows-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.14'
          - os: macos-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.14'
          - os: macos-latest
            python-version: '3.12'
            target: universal2-apple-darwin
          - os: macos-15
            python-version: '3.12'
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            python-version: '3.12'
            target: aarch64
          - os: macos-latest
            python-version: '3.14'
            target: universal2-apple-darwin
          - os: macos-15
            python-version: '3.14'
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            python-version: '3.14'
            target: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        if: matrix.build.target == 'aarch64'
        uses: docker/setup-qemu-action@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.build.python-version }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.build.target }}
          command: build
          args: --release --out dist -i python${{ matrix.build.python-version }}
          manylinux: auto
          working-directory: ${{ matrix.source_directory }}/p115strmhelper/rust_utils/share_strm_scan/

      - name: Build x86_64 musl wheels
        if: matrix.build.os == 'ubuntu-latest' && !matrix.build.target
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-unknown-linux-musl
          command: build
          args: --release --out dist -i python${{ matrix.build.python-version }}
          manylinux: auto
          working-directory: ${{ matrix.source_directory }}/p115strmhelper/rust_utils/share_strm_scan/

      - name: Build aarch64 musl wheels
        if: matrix.build.os == 'ubuntu-latest' && matrix.build.target == 'aarch64'
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64-unknown-linux-musl
          command: build
          args: --release --out dist -i python${{ matrix.build.python-version }}
          manylinux: auto
          working-directory: ${{ matrix.source_directory }}/p115strmhelper/rust_utils/share_strm_scan/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-share-strm-scan-${{ matrix.source_directory }}-${{ matrix.build.python-version }}-${{ matrix.build.os }}-${{ matrix.build.target }}
          path: ${{ matrix.source_directory }}/p115strmhelper/rust_utils/share_strm_scan/dist

  commit_wheels:
    name: Commit Wheels to Repository
    needs: [build_wheels]
    if: github.ref_type == 'branch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.ref_name }}
      SOURCE_DIRECTORIES: ${{ inputs.source_directory == 'both' && 'plugins.v2 plugins.v3' || inputs.source_directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Remove old files
        run: |
          for source_directory in $SOURCE_DIRECTORIES; do
            rm -rf "$source_directory/p115strmhelper/wheels/"share_strm_scan*
          done

      - name: Download V2 wheels
        if: inputs.source_directory == 'both' || inputs.source_directory == 'plugins.v2'
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-share-strm-scan-plugins.v2-*
          merge-multiple: true
          path: plugins.v2/p115strmhelper/wheels/

      - name: Download V3 wheels
        if: inputs.source_directory == 'both' || inputs.source_directory == 'plugins.v3'
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-share-strm-scan-plugins.v3-*
          merge-multiple: true
          path: plugins.v3/p115strmhelper/wheels/

      - name: Commit File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          for source_directory in $SOURCE_DIRECTORIES; do
            git add "$source_directory/p115strmhelper/wheels/"
          done
          if git diff --staged --quiet; then
            echo "没有新的 wheel 文件需要提交。"
          else
            git commit -m "build: 为 share_strm_scan 添加 wheels"
            bash .github/scripts/push_with_retry.sh "$TARGET_BRANCH"
          fi

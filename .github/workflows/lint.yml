name: Lint Python

on:
  push:
    paths:
      - '**/*.py'
      - '.github/workflows/lint.yml'
      - 'scripts/lint.py'
  pull_request:
    paths:
      - '**/*.py'
      - '.github/workflows/lint.yml'
      - 'scripts/lint.py'
  workflow_dispatch:

jobs:
  lint:
    name: Lint Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run lint check
        run: python scripts/lint.py --all

name: Test p115strmhelper

on:
  push:
    paths:
      # utils (test_cron_utils.py)
      - 'plugins.v2/p115strmhelper/utils/cron.py'
      # utils (test_exception_utils.py)
      - 'plugins.v2/p115strmhelper/utils/exception.py'
      # utils (test_limiter.py)
      - 'plugins.v2/p115strmhelper/utils/limiter.py'
      # utils (test_path_utils.py)
      - 'plugins.v2/p115strmhelper/utils/path.py'
      # utils (test_time_utils.py)
      - 'plugins.v2/p115strmhelper/utils/time.py'
      # utils (test_url_utils.py)
      - 'plugins.v2/p115strmhelper/utils/url.py'
      # utils (test_webhook_utils.py)
      - 'plugins.v2/p115strmhelper/utils/webhook.py'
      # utils (test_tree.py)
      - 'plugins.v2/p115strmhelper/utils/tree.py'
      - 'plugins.v2/p115strmhelper/tests/**'
      - 'plugins.v2/p115strmhelper/requirements.txt'
      - 'plugins.v2/p115strmhelper/rust_utils/**'
      - '.github/workflows/test-p115strmhelper.yml'
      - '.github/scripts/verify_native_test_wheels.py'
  pull_request:
    paths:
      # utils (test_cron_utils.py)
      - 'plugins.v2/p115strmhelper/utils/cron.py'
      # utils (test_exception_utils.py)
      - 'plugins.v2/p115strmhelper/utils/exception.py'
      # utils (test_limiter.py)
      - 'plugins.v2/p115strmhelper/utils/limiter.py'
      # utils (test_path_utils.py)
      - 'plugins.v2/p115strmhelper/utils/path.py'
      # utils (test_time_utils.py)
      - 'plugins.v2/p115strmhelper/utils/time.py'
      # utils (test_url_utils.py)
      - 'plugins.v2/p115strmhelper/utils/url.py'
      # utils (test_webhook_utils.py)
      - 'plugins.v2/p115strmhelper/utils/webhook.py'
      # utils (test_tree.py)
      - 'plugins.v2/p115strmhelper/utils/tree.py'
      - 'plugins.v2/p115strmhelper/tests/**'
      - 'plugins.v2/p115strmhelper/requirements.txt'
      - 'plugins.v2/p115strmhelper/rust_utils/**'
      - '.github/workflows/test-p115strmhelper.yml'
      - '.github/scripts/verify_native_test_wheels.py'
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.14'
          - os: windows-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.14'
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout plugin code
        uses: actions/checkout@v7

      - name: Checkout MoviePilot
        uses: actions/checkout@v7
        with:
          repository: jxxghp/MoviePilot
          path: MoviePilot
          ref: v2

      - name: Checkout MoviePilot resources
        uses: actions/checkout@v7
        with:
          repository: jxxghp/MoviePilot-Resources
          path: MoviePilot-Resources

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            MoviePilot/requirements.txt
            plugins.v2/p115strmhelper/requirements.txt

      - name: Install MoviePilot resources
        run: |
          python -c "from pathlib import Path; from shutil import copy2; src = Path('MoviePilot-Resources/resources.v2'); dst = Path('MoviePilot/app/helper'); dst.mkdir(parents=True, exist_ok=True); [copy2(p, dst / p.name) for p in src.iterdir() if p.is_file()]"

      - name: Build native dependencies for tests
        shell: bash
        run: |
          NATIVE_WHEELS_DIR="$(mktemp -d "$RUNNER_TEMP/p115-v2-native-wheels.XXXXXX")"
          echo "NATIVE_WHEELS_DIR=$NATIVE_WHEELS_DIR" >> "$GITHUB_ENV"
          python -m pip wheel --no-cache-dir --no-deps --config-settings=build-args=--locked --wheel-dir "$NATIVE_WHEELS_DIR" plugins.v2/p115strmhelper/rust_utils/full_strm_sync plugins.v2/p115strmhelper/rust_utils/txt_tree_storage plugins.v2/p115strmhelper/rust_utils/share_strm_scan

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install -r MoviePilot/requirements.txt
          python -m pip install --force-reinstall --no-deps "$NATIVE_WHEELS_DIR"/*.whl
          python -m pip install --find-links plugins.v2/p115strmhelper/wheels -r plugins.v2/p115strmhelper/requirements.txt pytest

      - name: Verify freshly built native imports
        shell: bash
        run: |
          python .github/scripts/verify_native_test_wheels.py "$NATIVE_WHEELS_DIR"
          python -c "import ahocorasick"

      - name: Run native tree contracts
        working-directory: plugins.v2/p115strmhelper/rust_utils/txt_tree_storage
        run: python -m pytest tests/test_parity.py -v

      - name: Run native share scan contracts
        working-directory: plugins.v2/p115strmhelper/rust_utils/share_strm_scan
        run: python -m unittest discover -s tests -v

      - name: Start Redis (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          sudo service redis-server start
          redis-cli ping

      - name: Start Redis (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install memurai-developer -y --no-progress
          $svc = Get-Service Memurai -ErrorAction SilentlyContinue
          if ($svc -and $svc.Status -ne 'Running') {
            Start-Service Memurai
          }
          Get-Service Memurai
        shell: powershell

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/MoviePilot${{ matrix.os == 'windows-latest' && ';' || ':' }}${{ github.workspace }}/plugins.v2/p115strmhelper
        run: |
          python -m unittest discover -s plugins.v2/p115strmhelper/tests -v
